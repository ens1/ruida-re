[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ruida-re"
version = "0.1.0"
description = "Embeddable Ruida protocol codec and controller backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tyler Long" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["laser", "reverse-engineering", "ruida"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/ens1/ruida-re"
Issues = "https://github.com/ens1/ruida-re/issues"
Security = "https://github.com/ens1/ruida-re/security/policy"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
test = [
    "jsonschema>=4.23",
    "pytest>=8",
]

[project.scripts]
ruida-advanced = "ruida_re.advanced:main"
ruida-catalog = "ruida_re.catalog:main"
ruida-capability-fixture = "ruida_re.capability_fixture:main"
ruida-conformance = "ruida_re.conformance:main"
ruida-controller = "ruida_re.controller_cli:main"
ruida-decode = "ruida_re.decode_cli:main"
ruida-diff = "ruida_re.diff:main"
ruida-encode = "ruida_re.encode_cli:main"
ruida-fixture = "ruida_re.fixture:main"
ruida-spec = "ruida_re.spec_cli:main"
ruida-verify = "ruida_re.verify:main"
ruida-lightburn-export = "ruida_re.lightburn_export:main"
ruida-lightburn-profile = "ruida_re.lightburn_profile:main"
ruida-matrix = "ruida_re.matrix:main"
ruida-raster-fixture = "ruida_re.raster_fixture:main"
ruida-experiment = "ruida_re.experiment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruida_re = [
    "data/schemas/*.json",
    "data/spec/*.json",
    "py.typed",
]
